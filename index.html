<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyxie: Minecraft packs tested for your setup</title>
<meta name="description" content="Nyxie: Minecraft resource packs, shaders, mods and maps, tested by our team and checked against your setup. Java and Bedrock.">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  // Apply saved theme before paint to avoid a flash.
  try { const t = localStorage.getItem("nyxie.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top" id="top"></header>
<main id="main" tabindex="-1"><div class="boot" aria-live="polite"><span class="spin" aria-hidden="true"></span></div></main>
<footer class="foot" id="foot"></footer>
<dialog id="dlg" class="dlg"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
