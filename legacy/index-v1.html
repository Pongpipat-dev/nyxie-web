.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 24px;text-align:center;background:radial-gradient(80% 90% at 50% 0,color-mix(in srgb,var(--ac) 12%,transparent),transparent 70%),var(--sf)}
.empty-i{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--soft);border:1px solid var(--soft2);box-shadow:0 0 0 8px color-mix(in srgb,var(--ac) 8%,transparent)}
.empty-i svg{width:32px;height:32px;fill:none;stroke:var(--ac);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty h3{margin:6px 0 0;font:700 20px Prompt,"Noto Sans Thai",sans-serif}
.empty p{margin:0 0 8px;max-width:360px;color:var(--mut);font-size:14.5px;line-height:1.6}
.bm{position:absolute;top:10px;left:10px;z-index:3;display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(14,10,24,.62);color:#fff;backdrop-filter:blur(8px);cursor:pointer;opacity:.9;transition:transform .18s,background .2s,opacity .2s,box-shadow .2s}
.bm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.bm:hover{transform:scale(1.08);opacity:1;background:rgba(14,10,24,.8)}
.bm.on{border-color:transparent;background:var(--grad);box-shadow:0 8px 18px -8px var(--ac);opacity:1}
.bm.on svg{fill:currentColor;transform:scale(1.05)}
.bm:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.bm,.bm svg,.afl button{transition:none}}
/* bookmark: move to top-right so it never covers the score badge */
.cw .bm{left:auto;right:12px;top:12px}
.cw:has(.th-b) .bm{top:48px}
/* admin Thumbnail button: bottom-right of the cover image */
.cw{container-type:inline-size}
.cw:has(.th-b) .bm{top:12px}
.cw .th-b{top:calc(56.25cqw - 44px);right:12px;bottom:auto;left:auto;z-index:3;padding:5px 12px;gap:8px;border-radius:999px;background:rgba(14,10,24,.66);border:1px solid rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px);box-shadow:none;font-size:12.5px;line-height:1.2;min-height:30px}
.cw .th-b:hover{background:var(--grad);border-color:transparent}
.saved-pg>h1{margin:0 0 6px}.saved-pg>p{margin:0 0 20px}
/* Settings button -> avatar + chevron */
button#st.btn.st{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:0;padding:0;border:0;background:transparent;box-shadow:none;color:var(--ink);border-radius:999px}
button#st .st-g,button#st .st-t{display:none}
button#st .st-av{display:block;flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid color-mix(in srgb,var(--ac) 55%,transparent);background:var(--soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 12%,transparent);transition:box-shadow .2s,border-color .2s,transform .2s}
button#st:hover .st-av,button#st[aria-expanded=true] .st-av{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent),0 8px 20px -8px var(--ac)}
button#st:hover .st-av{transform:translateY(-1px)}
button#st .st-c{flex:none;width:16px;height:16px;color:var(--ink);opacity:.85;transition:transform .25s,opacity .2s}
button#st:hover .st-c{opacity:1}
button#st[aria-expanded=true] .st-c{transform:rotate(180deg)}
button#st .um-n{position:absolute;top:-3px;left:28px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;font-size:11px;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--bg,#120d1c)}
button#st:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
.au-bm{position:relative}
.au-bm .bm-n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--grad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--bg,#120d1c)}
/* ===== Score badge: brand gradient ring + gradient star (matches violet/pink palette) ===== */
.card>div .sc,.rv .sc{display:inline-flex;align-items:center;gap:5px;padding:3px 12px 3px 10px;font:700 14px/1.4 Prompt,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);border:2px solid transparent;border-radius:999px;background:linear-gradient(var(--sf),var(--sf)) padding-box,var(--grad) border-box;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 30%,transparent),0 1px 0 color-mix(in srgb,var(--ac2) 35%,transparent);white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease}
.card:hover .sc{transform:translateY(-1px) scale(1.04);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 38%,transparent)}
.sc i{font-style:normal;font-size:1.05em;line-height:1}
.sc i,.rv .sc::before,.top li .sc::before{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.rv .sc{font-size:15px;padding:3px 14px 3px 11px}
/* ===== Detail score card: brand violet/pink ===== */
.score{gap:20px;padding:18px;border:2px solid var(--soft2);border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 11%,var(--sf)),color-mix(in srgb,var(--ac2) 9%,var(--sf)));box-shadow:0 14px 34px -18px var(--sh)}
.score .score-n{position:relative;width:96px;height:96px;border:0;border-radius:22px;background:var(--grad);color:#fff;font-size:42px;letter-spacing:-.02em;text-shadow:0 2px 6px rgba(29,22,49,.25);box-shadow:0 14px 26px -10px color-mix(in srgb,var(--ac) 65%,transparent),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.12);overflow:hidden}
.score .score-n::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
.score .score-n small{margin-top:2px;font-size:14px;font-weight:600;color:rgba(255,255,255,.88);opacity:1;text-shadow:none}
.score .score-t b{font-size:24px;letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.score .score-t span{margin-top:1px;font-size:14px;color:var(--mut)}
.score .bar{height:12px;margin-top:12px;padding:0;border:0;border-radius:999px;background:var(--soft2);box-shadow:inset 0 1px 2px color-mix(in srgb,var(--ink) 14%,transparent);backdrop-filter:none;overflow:hidden}
.score .bar::after{border:0;border-radius:999px;background:var(--grad);box-shadow:0 0 12px color-mix(in srgb,var(--ac2) 55%,transparent);animation:scfill .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes scfill{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.score .bar::after{animation:none}}
.score .ticks{margin-top:6px;padding:0 2px;font-size:11px;letter-spacing:.04em}
/* ===== Top 10: score pill matches the card badge (gradient ring) ===== */
.top li .sc{border:2px solid transparent;color:var(--ink);background:linear-gradient(var(--sf),var(--sf)) padding-box,var(--grad) border-box;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--ac) 55%,transparent)}
.top li:first-child .sc{box-shadow:0 8px 22px -6px color-mix(in srgb,var(--ac2) 65%,transparent)}
.top li .bar::after{box-shadow:0 0 10px color-mix(in srgb,var(--ac2) 50%,transparent)}
.top li:hover .sc{transform:translateY(-1px) scale(1.04)}.top li .sc{transition:transform .15s ease}
/* ===== Profile dialog additions ===== */
.pf-seg{grid-template-columns:minmax(0,.85fr) minmax(0,.85fr) minmax(0,1.3fr);gap:8px;margin:0 0 20px}
#pgl{margin:0 0 8px}
.pf-seg span{padding:11px 8px;font-size:14px;line-height:1.3;white-space:nowrap;text-align:center;height:100%;box-sizing:border-box}
.pf-vm{margin:-8px 0 18px}
.pf-vm.ok{gap:8px;line-height:1.2}
.sec-b{border:1.5px solid var(--soft2);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.sec-b h3{margin:0 0 4px;font-size:16px}
.sec-b p{margin:0 0 12px;font-size:14px}
.pf-w textarea{padding:11px 12px;font-size:16px;font-weight:400;border-width:3px;resize:vertical;min-height:84px;width:100%}
.pf-cnt{display:block;text-align:right;font-weight:600;margin-top:4px}
.pf-warn{color:var(--ac2);margin:-6px 0 12px}
.pf-w input[aria-invalid="true"],.pf-w textarea[aria-invalid="true"]{border-color:var(--ac2)}
.pf-ft .btn:disabled,#dly:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.35);box-shadow:none}
.pw-m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-2px 0 4px}.pw-m i{height:6px;border-radius:99px;background:var(--soft2)}
.pw-m[data-s="1"] i:nth-child(-n+1),.pw-m[data-s="2"] i:nth-child(-n+2),.pw-m[data-s="3"] i:nth-child(-n+3),.pw-m[data-s="4"] i{background:var(--grad)}
.dl-l{margin:0 0 14px;padding-left:20px;color:var(--mut)}
/* ===== Header: Sign up / theme toggle in brand style ===== */
.bar .au .au-su{border:0;background:var(--grad);color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(29,22,49,.25);box-shadow:0 10px 22px -10px color-mix(in srgb,var(--ac) 80%,transparent),0 3px 10px -4px color-mix(in srgb,var(--ac2) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.12);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.bar .au .au-su:hover{transform:translateY(-1px);filter:brightness(1.06) saturate(1.05);box-shadow:0 14px 26px -10px color-mix(in srgb,var(--ac) 90%,transparent),0 4px 14px -4px color-mix(in srgb,var(--ac2) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.12)}
.bar .au .au-su:active{transform:translateY(0);filter:none;box-shadow:0 4px 10px -6px color-mix(in srgb,var(--ac) 80%,transparent),inset 0 2px 0 rgba(0,0,0,.14)}
.bar .au .au-th{transition:box-shadow .2s ease,background .2s ease}
.bar .au .au-th:hover{background:color-mix(in srgb,var(--ac) 20%,var(--sf));box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 55%,transparent),0 8px 20px -8px color-mix(in srgb,var(--ac) 70%,transparent)}
.bar .au .au-su:focus-visible,.bar .au .au-th:focus-visible{outline:2px solid var(--ac2);outline-offset:3px}
/* ===== Footer: no dark border, brand accents ===== */
#ft .ft3.px{border:1px solid color-mix(in srgb,var(--ac) 18%,transparent);border-radius:24px;box-shadow:0 30px 60px -34px color-mix(in srgb,var(--ac) 55%,transparent),0 2px 0 color-mix(in srgb,#fff 60%,transparent) inset}
#ft .ft3.px::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);opacity:.95}
#ft .ft3 .ft-hr{border-top:1px solid color-mix(in srgb,var(--ac) 16%,transparent)}
#ft .ft-tg li{border:1px solid color-mix(in srgb,var(--ac) 22%,transparent);background:color-mix(in srgb,var(--ac) 8%,var(--sf));box-shadow:0 6px 14px -10px color-mix(in srgb,var(--ac) 60%,transparent)}
#ft .ft3 .ft-s a{background:color-mix(in srgb,var(--ac) 9%,var(--sf));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 18%,transparent)}
#ft .ft3 .ft-s a:hover{background:var(--grad);color:#fff;box-shadow:0 12px 22px -10px var(--ac2)}
#ft .ft-lg a:hover{color:var(--ac);text-decoration:none}
/* ===== Responsive layer: phone / tablet / laptop / ultrawide / touch / landscape ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
img,svg,video,canvas{max-width:100%;height:auto}
h1{font-size:clamp(26px,4.6vw,44px);overflow-wrap:anywhere}
h2{font-size:clamp(20px,3vw,28px);overflow-wrap:anywhere}
p,li,td,th,a{overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
dialog{width:min(92vw,440px);max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain}
input,select,textarea{max-width:100%}
/* tablet and below */
@media(max-width:900px){
.filters{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.hero{padding:32px 20px}
table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
}
/* phones */
@media(max-width:600px){
#ft .ft3.px{padding:28px 16px 20px;border-radius:20px}
#ft .ft3 .ft-hr{margin:22px -16px}
.ft-tg{gap:8px}
.ft-nv{gap:4px 16px}
.ft3 .ft-s{gap:10px}
.score{flex-wrap:wrap;justify-content:center;text-align:center}
.score .score-t{flex:1 1 200px;min-width:0}
.top li{flex-wrap:wrap}
.top li>*{min-width:0}
.hero{padding:26px 16px;margin-bottom:26px}
.pf-g2{grid-template-columns:1fr}
input,select,textarea{font-size:16px}
dialog{width:calc(100vw - 20px)}
}
@media(max-width:380px){
.score .score-n{width:84px;height:84px;font-size:36px}
.ft-lg a{padding:2px 8px;font-size:12px}
}
/* short landscape screens */
@media(max-height:480px) and (orientation:landscape){
dialog{max-height:96dvh}
.hero{padding:18px 16px}
}
/* large and ultrawide screens */
@media(min-width:1500px){
html{font-size:17px}
}
/* touch devices: bigger tap targets, no hover-only effects */
@media(pointer:coarse){
.btn,.au-th,.ft-s a,.filters select,.filters input{min-height:44px}
.ft-lg a,.ft-nv a{padding-top:10px;padding-bottom:10px}
}
@media(hover:none){
.card:hover .sc,.top li:hover .sc,.bar .au .au-su:hover,.ft-tg li:hover,.ft3 .ft-s a:hover{transform:none}
}
/* ===== Cookie consent: brand polish ===== */
#cc .cc-b{background:linear-gradient(90deg,var(--ac),var(--ac2)) top/100% 4px no-repeat,radial-gradient(90% 120% at 0 0,color-mix(in srgb,var(--ac) 14%,transparent),transparent 65%),radial-gradient(70% 100% at 100% 100%,color-mix(in srgb,var(--ac2) 10%,transparent),transparent 70%),var(--sf);padding-top:26px;box-shadow:0 34px 70px -28px color-mix(in srgb,var(--ac) 60%,transparent)}
#cc h2{letter-spacing:-.01em}
#cc p a{margin-top:6px;font-size:13px}
#cc .cc-o label{border-width:1px;border-color:color-mix(in srgb,var(--ac) 22%,transparent);border-radius:16px;background:color-mix(in srgb,var(--ac) 5%,var(--sf))}
#cc .cc-o label:has(input:checked:not(:disabled)){border-color:color-mix(in srgb,var(--ac) 65%,transparent);background:color-mix(in srgb,var(--ac) 12%,var(--sf));box-shadow:0 10px 24px -16px var(--ac)}
#cc .cc-o label:has(input:disabled){opacity:1;background:color-mix(in srgb,var(--ink) 5%,var(--sf));border-color:color-mix(in srgb,var(--ink) 14%,transparent)}
#cc .cc-o input[type=checkbox]{width:42px;height:24px;margin-top:1px;border:0;border-radius:999px;background:radial-gradient(circle 9px at 12px 50%,#fff 98%,transparent) no-repeat,color-mix(in srgb,var(--ink) 22%,var(--sf))}
#cc .cc-o input[type=checkbox]:checked{background:radial-gradient(circle 9px at 30px 50%,#fff 98%,transparent) no-repeat,var(--grad)}
#cc .cc-o input[type=checkbox]:disabled:checked{opacity:.55}
#cc .cc-a .btn:not(.g){border:0;color:#fff;background:var(--grad);box-shadow:0 12px 22px -12px color-mix(in srgb,var(--ac) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
#cc .cc-a .btn.g{background:transparent;color:var(--ink);border:2px solid color-mix(in srgb,var(--ac) 45%,transparent);box-shadow:none}
#cc .cc-a .btn.g:hover{background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:var(--ac)}
#cc .cc-a .btn:focus-visible{outline:3px solid var(--ac2);outline-offset:3px}

"download-safety":{title:"Download Safety & Security",body:`At Nyxie, your safety and browsing experience are important to us. We aim to help Minecraft players discover useful Resource Packs, Shaders, Mods, Maps, and other community-created content while making it easier to find the original sources.
We believe that downloading Minecraft content should be simple, transparent, and safe. This page explains how our download links work and provides important security recommendations to help protect your device.
## 1. We Do Not Host Download Files
Nyxie does not host, store, or distribute third-party Minecraft files on its own servers.
Instead, we provide information, reviews, descriptions, screenshots, compatibility details, and links to the original download pages provided by the respective creators or authorized platforms.
When you click a download link on our website, you will be redirected to an external website. The actual file download is handled by that external platform, not by Nyxie.
We encourage users to download files directly from the original creators or trusted platforms whenever possible.
## 2. Download from Original Sources
To reduce the risk of downloading modified, outdated, or potentially harmful files, we recommend using official creator pages and trusted Minecraft community platforms.
Examples of platforms where users may discover Minecraft content include:
* Modrinth
* CurseForge
* Planet Minecraft
* MCPEDL
* Official creator websites and project pages
Always verify that the download page belongs to the original creator or an authorized distribution platform before downloading any file.
## 3. Scan Files Before Opening
Even when downloading from a familiar website, you should take precautions before opening downloaded files.
We recommend:
* Scan downloaded files using updated antivirus or security software.
* Use Windows Security or another reputable security solution.
* Check the file extension before opening it.
* Avoid files from unknown sources or suspicious download pages.
* Do not disable antivirus protection to install a Minecraft modification.
* Keep your operating system, Minecraft, and security software updated.
You can also use reputable online file-scanning services, such as VirusTotal, to help identify potentially suspicious files. Do not upload private or confidential files to public scanning services.
## 4. Be Careful with EXE Files
Most Minecraft Resource Packs, Texture Packs, and many Mods are distributed in formats such as:
* .zip
* .mcpack
* .mcaddon
* .mcworld
* .jar
Be especially careful with .exe files, as they are executable programs that can make changes to your computer.
An EXE installer is not automatically malicious, but it should not be necessary for many standard Minecraft Resource Packs or texture packs.
If a download page asks you to install an unknown program, browser extension, downloader, or additional software just to obtain a Minecraft file, we recommend stopping and checking the source.
Never run an executable file unless you understand what it does and trust its publisher.
## 5. Check Minecraft Version Compatibility
Before downloading and installing any content, check its compatibility with your Minecraft edition and version.
Minecraft Java Edition and Minecraft Bedrock Edition use different file formats and installation methods.
We recommend checking:
* Supported Minecraft versions.
* Java Edition or Bedrock Edition compatibility.
* Required dependencies or additional Mods.
* Installation instructions provided by the creator.
* Whether the project is still maintained or updated.
Installing incompatible files may cause crashes, errors, or unexpected behavior.
## 6. Beware of Fake Download Buttons and Suspicious Redirects
Some third-party websites may display advertisements, misleading download buttons, pop-ups, or redirects.
Please make sure you select the actual download option provided by the original creator.
Nyxie aims to provide clearly labeled external links and does not intentionally direct users to unrelated software downloads or misleading websites.
If you encounter suspicious advertisements, unexpected redirects, or requests to install unknown software, leave the page immediately.
## 7. Third-Party Websites and External Links
Our website may contain links to external websites that are not owned, operated, or controlled by Nyxie.
Each external website has its own privacy policy, security practices, and terms of service.
We cannot guarantee the availability, accuracy, security, or safety of files hosted by third-party websites. Users should review the relevant information and exercise their own judgment before downloading or installing any content.
## 8. Report Suspicious Links
Your feedback helps us maintain a better and safer resource directory.
If you discover a broken download link, suspicious website, misleading download button, or potentially harmful file associated with a listing on Nyxie, please contact us.
Please include the name of the Minecraft content and the relevant page URL so we can investigate the report.
Contact: nyxieofficial.work@gmail.com
## 9. Our Commitment to Users
Nyxie is committed to providing transparent information, useful Minecraft content discoveries, and a better browsing experience.
We continuously aim to improve the quality of our listings, review information, external links, and security recommendations.
Stay informed, download responsibly, and always use trusted sources.
! Last Updated: November 2026
~ Nyxie is an independent Minecraft content discovery and review website. We are not affiliated with, endorsed by, or officially connected to Mojang Studios or Microsoft.`},
"privacy":{title:"Privacy Policy",body:`! Last Updated: November 12, 2026
Welcome to Nyxie (referred to as “we,” “our,” or “us”).
At Nyxie, accessible through https://nyxiemc.com, we respect your privacy and are committed to protecting your personal information.
This Privacy Policy explains what information we collect, how we use it, how third-party services may process your information, and the choices available to you when visiting our website.
By using Nyxie, you agree to the practices described in this Privacy Policy.
## 1. Information We Collect
We may collect certain information when you visit or interact with our website.
### 1.1 Personal Information
We do not require visitors to provide personal information to browse most of our website.
However, we may collect personal information when you voluntarily contact us through email or other communication methods, including:
* Name or username, if provided.
* Email address.
* Information included in your message.
* Any other information you voluntarily submit.
We use this information only for communication, responding to inquiries, and addressing reported issues.
### 1.2 Automatically Collected Information
When you visit Nyxie, certain non-identifying or technical information may be collected automatically, including:
* IP address.
* Browser type and version.
* Device type and operating system.
* Pages visited and referring URLs.
* Date and time of visits.
* General website usage and interaction data.
This information helps us understand how visitors use our website, maintain security, improve performance, and enhance the user experience.
## 2. Cookies and Tracking Technologies
Nyxie may use cookies and similar technologies to improve website functionality and understand visitor behavior.
Cookies are small text files stored on your device that help websites remember preferences and collect usage information.
We may use cookies for purposes such as:
* Remembering user preferences.
* Understanding website traffic.
* Improving website performance.
* Measuring advertising effectiveness (only if you accept Advertising cookies).
* Showing and personalizing advertising (only if you accept Advertising cookies).
Necessary cookies are always active. Analytics and advertising cookies are used only after you give consent through our cookie banner. You can change or withdraw your choice at any time using the cookie button (🍪) at the bottom left of the page. You can also manage or delete cookies through your browser settings. However, disabling certain cookies may affect some website features.
## 3. Google AdSense and Third-Party Advertising
Nyxie may display advertisements served by Google AdSense and other third-party advertising services.
### Ads are shown only with your consent
Advertising scripts and advertising cookies are not loaded until you select “Accept all” or enable “Advertising” in our cookie banner. If you reject advertising or make no choice, we do not load Google AdSense and no advertising cookies are set by it.
You can change or withdraw your consent at any time using the cookie button (🍪) at the bottom left of any page. Withdrawing consent stops advertising cookies from being used on later page loads; you can delete existing cookies through your browser settings. Your choice is stored in your browser for up to 12 months, after which we will ask again.
Advertisements are labeled “Advertisement” and are placed away from download buttons, so you are not misled into clicking an ad by mistake.
### How advertising partners use cookies
When you accept advertising, third-party vendors, including Google, may use cookies to serve ads based on a user’s previous visits to this website or other websites.
Google’s use of advertising cookies enables Google and its partners to serve advertisements to visitors based on their visits to Nyxie and other websites across the Internet.
These technologies may include:
* Cookies.
* Web beacons.
* IP addresses.
* Advertising identifiers and similar technologies.
Third-party advertising providers may collect and process information according to their own privacy policies.
You can learn more about how Google uses data when you visit websites that use its services here:
https://policies.google.com/technologies/partner-sites
You can manage personalized advertising through Google’s Ads Settings:
https://adssettings.google.com/
You may also visit the following website to learn about additional advertising opt-out options:
https://www.aboutads.info/
## 4. Google Analytics and Website Analytics
We may use analytics services, such as Google Analytics, to understand how visitors interact with Nyxie.
These services may collect information such as:
* Pages viewed.
* Session duration.
* Traffic sources.
* Device and browser information.
* General interaction and navigation patterns.
This information helps us analyze website performance, improve content quality, and provide a better experience.
For more information about Google’s privacy practices, please visit:
https://policies.google.com/privacy
## 5. Third-Party Websites and External Links
Nyxie provides links to third-party websites where users can discover or download Minecraft Resource Packs, Shaders, Mods, Maps, and other community-created content.
We do not host or store third-party download files on our own servers unless explicitly stated otherwise.
When you click an external link, you will leave Nyxie and visit a website operated by another organization or individual.
These external websites may have their own privacy policies, cookies, tracking technologies, and data collection practices.
We are not responsible for the privacy practices, content, security, or policies of third-party websites.
We encourage visitors to review the privacy policies of external websites before providing personal information or downloading files.
## 6. How We Use Your Information
Information collected through Nyxie may be used for the following purposes:
* To operate and maintain our website.
* To improve website content and functionality.
* To understand visitor behavior and website performance.
* To respond to questions, feedback, and inquiries.
* To investigate suspicious activity and security issues.
* To measure advertising performance.
* To comply with applicable legal obligations.
We do not intentionally collect more personal information than is necessary for these purposes.
## 7. Data Sharing and Disclosure
We do not sell visitors’ personal information.
However, information may be shared with trusted third-party service providers when necessary to operate our website, including:
* Advertising providers, such as Google AdSense.
* Website analytics providers.
* Website hosting and technical service providers.
* Security and spam prevention services.
These providers may process certain information according to their own privacy policies and applicable requirements.
We may also disclose information when required by law or when necessary to protect our rights, users, website, or security.
## 8. Data Security
We take reasonable technical and organizational measures to protect information collected through Nyxie.
However, no method of transmitting or storing information over the Internet is completely secure.
While we work to protect our website and visitors’ information, we cannot guarantee absolute security.
## 9. Children’s Privacy
Nyxie is intended for a general audience.
We do not knowingly collect personal information directly from children under the age of 13.
If you believe that a child has provided personal information to us, please contact us so that we can review and take appropriate action.
## 10. Your Privacy Rights
Depending on your location and applicable privacy laws, you may have certain rights regarding your personal information, including:
* Requesting access to personal information we hold about you.
* Requesting correction of inaccurate information.
* Requesting deletion of personal information where applicable.
* Objecting to or restricting certain processing activities.
* Withdrawing consent where processing is based on consent.
To exercise applicable privacy rights, please contact us using the information provided below.
## 11. International Visitors
Nyxie is accessible to visitors worldwide.
Depending on your location, information collected through our website may be processed by third-party service providers in different countries.
We aim to handle information in accordance with applicable privacy requirements and the disclosures described in this policy.
Where required, we will provide appropriate notices and obtain consent for relevant data processing activities.
## 12. Changes to This Privacy Policy
We may update this Privacy Policy from time to time to reflect changes in our website, services, legal requirements, or advertising practices.
Any updates will be published on this page with a revised Last Updated date.
We encourage visitors to review this page periodically.
## 13. Contact Us
If you have questions, concerns, or requests regarding this Privacy Policy or how your information is handled, please contact us:
Website: https://nyxiemc.com
Email: nyxieofficial.work@gmail.com
We will make reasonable efforts to review and respond to privacy-related inquiries.
~ Nyxie is an independent Minecraft content discovery and review website. We are not affiliated with, endorsed by, or officially connected to Mojang Studios or Microsoft.`},
